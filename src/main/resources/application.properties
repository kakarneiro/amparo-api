spring.application.name=amparo-api
server.port=${SERVER_PORT:8080}

# Banco padrao: PostgreSQL (mesmo que vai rodar em container no DevOps)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/amparo}
spring.datasource.username=${DB_USER:amparo}
spring.datasource.password=${DB_PASSWORD:amparo}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Paginacao padrao
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# data.sql so no perfil dev
spring.sql.init.mode=never
