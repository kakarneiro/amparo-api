spring.application.name=amparo-api
server.port=${SERVER_PORT:8080}

# Banco padrao: PostgreSQL (mesmo que vai rodar em container no DevOps)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/amparo}
spring.datasource.username=${DB_USER:amparo}
spring.datasource.password=${DB_PASSWORD:amparo}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Paginacao padrao
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# data.sql so no perfil dev
spring.sql.init.mode=never

# ===== Seguranca =====
# Segredo do JWT: em producao vem da variavel JWT_SECRET (minimo 32 caracteres)
amparo.jwt.secret=${JWT_SECRET:amparo-gs-2026-citizentech-chave-de-desenvolvimento-troque-em-producao}
amparo.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Token fixo que o ESP32 envia no header X-Device-Token
amparo.device-token=${DEVICE_TOKEN:esp32-amparo-dev-token}
# Origens permitidas para o app Mobile (separadas por virgula). * = qualquer uma
amparo.cors.allowed-origins=${CORS_ORIGINS:*}
